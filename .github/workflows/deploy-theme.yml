name: Deploy Theme
on:
  push:
    branches:
      - master
      - main

# The deploy action only uses the Ghost Admin API secrets, never the GitHub token.
permissions:
  contents: read

# One deploy at a time. A deploy in progress is never cancelled; a newer push replaces one still waiting,
# so the last push is the one that ends up on the site.
concurrency:
  group: deploy-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as on pull requests (ci.yml): format and lint, the build matches the committed
  # assets, the browser tests and gscan. The deploy waits for them and is skipped if one fails.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # No checkout: the site gets the archive the checks built with npm run zip and passed through gscan
      # (ci.yml, artifact theme-zip), not a second zip made here with other exclusions
      - name: Download the checked theme archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: theme-zip
      - name: Deploy Ghost Theme
        uses: TryGhost/action-deploy-theme@a0ee1147d15641db25681e54549c4db9a53c2629 # v1.6.6 (what @v1 resolved to)
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          # The theme takes the zip's name in Ghost: attibling, as package.json's name
          file: attibling.zip
